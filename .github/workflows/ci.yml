name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 1. Solución para la advertencia de deprecación de Node 20 en las Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run validate:migrations

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start Supabase local
        run: supabase start

      - name: Export Supabase env vars
        run: |
          SUPABASE_ENV=$(supabase status -o env)
          echo "$SUPABASE_ENV" >> $GITHUB_ENV
          eval "$SUPABASE_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> $GITHUB_ENV

      - name: Reset database (apply migrations + seed)
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint --level error

      - name: Run integration tests
        run: npm run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CYCLE_AUTOMATION: "true"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
