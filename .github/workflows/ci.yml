name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run validate:migrations

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Start Supabase local
        run: supabase start

      - name: Export Supabase env vars
        run: |
          SUPABASE_ENV=$(supabase status -o env)
          echo "$SUPABASE_ENV" >> $GITHUB_ENV

      - name: Reset database (apply migrations + seed)
        run: supabase db reset

      - name: Run integration tests
        run: npm run test:integration

      - name: Run RLS tests
        run: npm run test:rls

      - name: Run audit tests
        run: npm run test:audit

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
